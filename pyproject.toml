[project]
name = "subtitle-maker"
version = "0.1.0"
description = "Local subtitle generator using Qwen3-ASR"
requires-python = ">=3.10"
dependencies = [
    "torch==2.3.1",
    "torchaudio==2.3.1",
    "transformers",
    "ffmpeg-python",
    "soundfile>=0.12.1",
    "accelerate",
    "qwen-asr",
    "numba>=0.60.0",
    "openai",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "jinja2",
    "aiofiles",
    "demucs>=4.0.1",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "onnxruntime>=1.23.2",
]

[project.scripts]
subtitle-maker = "subtitle_maker.cli:main"
subtitle-maker-web = "subtitle_maker.web:start"
subtitle-maker-simple-web = "subtitle_maker.simple_web:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 排除 vendor 和外部工程
norecursedirs = [
    ".*",
    "build",
    "dist",
    "*.egg",
    "venv",
    ".venv",
    "OmniVoice-Studio-main",
    "VoxCPM",
    "index-tts-1108",
]
markers = [
    "unit: 快速合同测试，不启动模型或外部服务",
    "integration: API 回归测试，可 mock 后端",
    "requires_model: 需要真实模型加载",
    "requires_mic: 需要麦克风硬件",
]
